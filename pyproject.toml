[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colorblind-document-assistant"
version = "0.1.0"
description = "Preserve PDF text and geometry while improving protanopia readability"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "pypdf>=6.0,<7",
  "pypdfium2>=4.30,<6",
  "reportlab>=4.2,<5",
  "Pillow>=10,<13",
  "numpy>=1.26,<3",
  "daltonlens>=0.1.5,<0.2",
  "openai>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
colorblind-assistant = "colorblind_assistant.cli:main"

[tool.setuptools.packages.find]
include = ["colorblind_assistant*"]
